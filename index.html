    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auma Sweets | Confeitaria </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');

        :root {
            --cream: #f9f6ed;
            --burgundy: #850000;
            --burgundy-dark: #5c0000;
            --burgundy-light: #a01818;
            --gold: #c9a96e;
            --warm-gray: #8a7e6f;
        }

        body {
            background-color: var(--cream);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .font-serif-display { font-family: 'Playfair Display', serif; }
        .font-cormorant { font-family: 'Cormorant Garamond', serif; }

        .bg-glow-top {
            background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(133, 0, 0, 0.12), transparent 70%);
        }

        @keyframes borderGlow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(133, 0, 0, 0.3), 0 0 40px rgba(133, 0, 0, 0.15);
                border-color: rgba(133, 0, 0, 0.4);
            }
            50% {
                box-shadow: 0 0 30px rgba(133, 0, 0, 0.5), 0 0 60px rgba(133, 0, 0, 0.2);
                border-color: rgba(133, 0, 0, 0.7);
            }
        }
        .profile-border-animated { animation: borderGlow 4s ease-in-out infinite; }

        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(133, 0, 0, 0.15);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(133, 0, 0, 0.4);
            box-shadow: 0 8px 30px rgba(133, 0, 0, 0.12);
            transform: scale(1.02);
        }

        .divider-line {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin: 1.5rem 0;
        }
        .divider-line::before, .divider-line::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(133, 0, 0, 0.3), transparent);
            max-width: 60px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        .star-icon { color: var(--burgundy); opacity: 0.6; }

        .paper-texture {
            background-image:
                radial-gradient(circle at 20% 80%, rgba(133, 0, 0, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(201, 169, 110, 0.04) 0%, transparent 50%);
        }

        .premium-tag {
            background: linear-gradient(135deg, rgba(133, 0, 0, 0.08), rgba(201, 169, 110, 0.08));
            border: 1px solid rgba(133, 0, 0, 0.2);
        }
    </style>
</head>
<body class="paper-texture">

    <div class="fixed inset-0 bg-glow-top pointer-events-none"></div>

    <main class="relative min-h-screen flex items-center justify-center py-10 px-4">

                <!-- Card 2: iFood -->

                    target="_blank" rel="noopener noreferrer"
                    class="glass-card rounded-2xl overflow-hidden fade-in-up delay-2 block no-underline"
                >
                    <div class="flex items-center">
                        <div class="flex-1 flex flex-col justify-center p-4">
                            <h2 class="font-serif-display text-lg font-bold" style="color: var(--burgundy);">
                                Peça pelo iFood

            <footer class="flex justify-center gap-5 mb-4">

                    aria-label="TikTok">
                    <i class="fa-brands fa-tiktok text-base" style="color: var(--burgundy);"></i>
                </a>
            </footer>

            <p class="text-center text-xs font-cormorant italic" style="color: var(--warm-gray);">
                Auma Sweets © 2026
            </p>

        </div>
    </main>
</body>
